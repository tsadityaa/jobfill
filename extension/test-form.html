<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Autofill Test Form</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: 40px auto; padding: 20px; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    h1 { color: #333; }
    .section { border: 1px solid #ddd; padding: 16px; margin: 16px 0; border-radius: 8px; }
    h2 { margin-top: 0; }
  </style>
</head>
<body>
  <h1>Job Application Test Form</h1>

  <div class="section">
    <h2>Personal Info</h2>
    <label for="first_name">First Name</label>
    <input type="text" id="first_name" name="first_name" placeholder="Enter first name">

    <label for="last_name">Last Name</label>
    <input type="text" id="last_name" name="last_name" placeholder="Enter last name">

    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" placeholder="you@example.com">

    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" name="phone" placeholder="+91 XXXXXXXXXX">
  </div>

  <div class="section">
    <h2>Address</h2>
    <label for="addr1">Address Line 1</label>
    <input type="text" id="addr1" name="address_line1" placeholder="Street address">

    <label for="city">City</label>
    <input type="text" id="city" name="city" placeholder="City">

    <label for="state">State</label>
    <input type="text" id="state" name="state" placeholder="State">

    <label for="zip">Postal Code</label>
    <input type="text" id="zip" name="postal_code" placeholder="PIN code">

    <label for="country">Country</label>
    <select id="country" name="country">
      <option value="">Please Select</option>
      <option value="IN">India</option>
      <option value="US">United States</option>
    </select>
  </div>

  <div class="section">
    <h2>Education</h2>
    <label for="university">University / College</label>
    <input type="text" id="university" name="institution" placeholder="University name">

    <label for="degree">Degree</label>
    <input type="text" id="degree" name="degree" placeholder="e.g. B.Tech">

    <label for="field_of_study">Field of Study</label>
    <input type="text" id="field_of_study" name="major" placeholder="e.g. Computer Science">
  </div>

  <div class="section">
    <h2>Tricky Fields (AI should handle these)</h2>
    <label for="entry_123">What is your contact number?</label>
    <input type="text" id="entry_123" name="entry.123456" placeholder="Your answer">

    <label for="entry_456">Name of your college/university?</label>
    <input type="text" id="entry_456" name="entry.789012" placeholder="Your answer">

    <label for="q_linkedin">LinkedIn Profile URL</label>
    <input type="url" id="q_linkedin" name="q_lin" placeholder="https://linkedin.com/in/...">
  </div>

  <div class="section">
    <h2>Sensitive (should NOT auto-fill)</h2>
    <label for="salary">Expected Salary (CTC)</label>
    <input type="text" id="salary" name="salary_expectation">

    <label for="gender">Gender</label>
    <select id="gender" name="gender">
      <option value="">Select</option>
      <option value="M">Male</option>
      <option value="F">Female</option>
      <option value="O">Other</option>
    </select>
  </div>

  <hr>
  <p><strong>Debug:</strong></p>
  <pre id="debug"></pre>
  <script>
    // Self-diagnostic
    const inputs = document.querySelectorAll('input:not([type="hidden"]):not([type="submit"]):not([type="button"]):not([type="reset"]):not([type="image"]):not([type="file"]), select, textarea');
    const debugEl = document.getElementById('debug');
    let debug = 'Total form elements: ' + inputs.length + '\n\n';
    inputs.forEach((el, i) => {
      debug += 'Field ' + i + ': <' + el.tagName.toLowerCase() + '> type=' + (el.type||'') + ' name=' + (el.getAttribute('name')||'') + ' id=' + (el.id||'') + ' visible=' + (el.offsetParent !== null) + '\n';
    });
    debugEl.textContent = debug;
  </script>
</body>
</html>
